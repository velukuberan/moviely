services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: moviely_test
      POSTGRES_USER: moviely_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
      MOVIELY_TEST_POSTGRES: "1"
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
    networks:
      - backend
